name: Automated ClickUp Dashboard Pipeline

on:
  schedule:
    - cron: '0 8 * * *' # Every day at 8:00 AM UTC
  workflow_dispatch: # Manual run button

jobs:
  build-and-push-report:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository code
      uses: actions/checkout@v4

    - name: Setup Node.js environment
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Inject ClickUp Data into Dashboard Template
      env:
        CLICKUP_TOKEN: ${{ secrets.CLICKUP_TOKEN }}
        CLICKUP_VIEW_ID: "3478950" 
      run: |
        node -e "
        const fs = require('fs');

        async function run() {
          try {
            console.log('Fetching live data from ClickUp API...');
            
            const response = await fetch('https://clickup.com' + process.env.CLICKUP_VIEW_ID + '/task', {
              headers: { 'Authorization': process.env.CLICKUP_TOKEN }
            });
            
            if (!response.ok) throw new Error('ClickUp API failed: ' + response.statusText);
            const data = await response.json();
            
            // Format tasks to match your exact dashboard keys: Team, Status, Quarter, Assignee
            const formattedTasks = data.tasks.map(task => {
              // Extract Custom Fields safely if they exist, otherwise fallback
              const getCustomField = (name) => {
                const field = task.custom_fields?.find(f => f.name.toLowerCase() === name.toLowerCase());
                return field ? field.value : 'N/A';
              };

              return {
                "Task": task.name || 'Untitled',
                "Status": task.status ? task.status.status : 'Open',
                "Assignee": task.assignees?.map(a => a.username).join(', ') || 'Unassigned',
                "Team": getCustomField('Team'),      // Assumes a ClickUp custom field named 'Team'
                "Quarter": getCustomField('Quarter') // Assumes a ClickUp custom field named 'Quarter'
              };
            });

            // Convert array to a clean string format
            const jsonString = JSON.stringify(formattedTasks, null, 2);

            // Read your pristine dashboard layout template
            let templateHtml = fs.readFileSync('dashboard_template.html', 'utf8');

            // Swap our token with the live array data string
            let finalHtml = templateHtml.replace('<!-- CLICKUP_DATA_ROWS -->', jsonString);

            // Write the final live dashboard file out to index.html
            fs.writeFileSync('index.html', finalHtml);
            console.log('✓ Target index.html successfully compiled with automated dataset.');
            
          } catch (error) {
            console.error('Pipeline Processing Error:', error);
            process.exit(1);
          }
        }
        run();
        "

    - name: Commit and Push update back to GitHub
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@://github.com"
        
        git add index.html
        
        if git diff-index --quiet HEAD; then
          echo "No dataset changes detected. Skipping push."
        else
          git commit -m "Automated dashboard dataset refresh: $(date +'%Y-%m-%d %H:%M:%S')"
          git push
          echo "✓ Successfully deployed new live base-repo report."
        fi
