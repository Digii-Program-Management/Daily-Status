name: Automated ClickUp Dashboard to HTML Pipeline

on:
  schedule:
    # Runs every day at 08:00 AM UTC (Change cron expression to adjust timing)
    - cron: '0 8 * * *'
  workflow_dispatch: # Allows you to manually trigger the workflow anytime from the GitHub UI

jobs:
  build-and-push-report:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository code
      uses: actions/checkout@v4

    - name: Setup Node.js environment
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Fetch ClickUp Data and Generate HTML
      env:
        CLICKUP_TOKEN: \${{ secrets.CLICKUP_TOKEN }}
        # Replace this with your actual ClickUp View or List ID
        CLICKUP_VIEW_ID: "3478950" 
      run: |
        node -e "
        const fs = require('fs');

        async function run() {
          try {
            console.log('Fetching live data from ClickUp API...');
            
            // 1. Fetch data from ClickUp API (adjust endpoint based on whether you want tasks or view data)
            const response = await fetch('https://clickup.com' + process.env.CLICKUP_VIEW_ID + '/task', {
              headers: { 'Authorization': process.env.CLICKUP_TOKEN }
            });
            
            if (!response.ok) throw new Error('ClickUp API failed: ' + response.statusText);
            const data = await response.json();
            
            // 2. Format tasks into HTML table row strings
            const rows = data.tasks.map(task => \`
              <tr>
                <td>\${task.id}</td>
                <td><strong>\${task.name}</strong></td>
                <td><span class='status-badge'>\${task.status.status.toUpperCase()}</span></td>
                <td>\${task.assignees.map(a => a.username).join(', ') || 'Unassigned'}</td>
              </tr>
            \`).join('');

            // 3. Build out the standalone structured HTML file template
            const htmlContent = \`<!DOCTYPE html>
            <html>
            <head>
              <meta charset='UTF-8'>
              <title>Automated ClickUp Data Dashboard</title>
              <style>
                body { font-family: sans-serif; margin: 40px; background: #f8f9fa; color: #333; }
                .card { background: white; padding: 24px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
                h1 { color: #7b68ee; margin-top: 0; }
                .meta { color: #666; margin-bottom: 20px; font-size: 0.9rem; }
                table { width: 100%; border-collapse: collapse; margin-top: 10px; }
                th, td { text-align: left; padding: 12px; border-bottom: 1px solid #eee; }
                th { background-color: #f1f0ff; color: #444; }
                .status-badge { background: #e6e5ff; color: #7b68ee; padding: 4px 8px; border-radius: 4px; font-size: 0.8rem; font-weight: bold; }
              </style>
            </head>
            <body>
              <div class='card'>
                <h1>Daily ClickUp Sync Report</h1>
                <div class='meta'>Generated automatically on: \${new Date().toLocaleString()}</div>
                <table>
                  <thead>
                    <tr>
                      <th>Task ID</th>
                      <th>Task Name</th>
                      <th>Status</th>
                      <th>Assignees</th>
                    </tr>
                  </thead>
                  <tbody>
                    \${rows || '<tr><td colspan=\"4\">No tasks found in this dashboard view.</td></tr>'}
                  </tbody>
                </table>
              </div>
            </body>
            </html>\`;

            // 4. Save the file directly to your workspace repository directory
            fs.writeFileSync('index.html', htmlContent);
            console.log('✓ index.html successfully compiled with fresh data.');
            
          } catch (error) {
            console.error('Pipeline Error:', error);
            process.exit(1);
          }
        }
        run();
        "

    - name: Commit and Push update back to GitHub
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.line "github-actions[bot]@://github.com"
        
        # Add generated html file to staging tracking
        git add index.html
        
        # Only commit and push if changes exist (prevents pipeline errors if data hasn't changed)
        if git diff-index --quiet HEAD; then
          echo "No shifts or changes detected in dashboard data. Skipping push."
        else
          git commit -m "Automated daily base-repo update: \$(date +'%Y-%m-%d %H:%M:%S')"
          git push
          echo "✓ Successfully deployed new automated report version to main branch."
        fi
