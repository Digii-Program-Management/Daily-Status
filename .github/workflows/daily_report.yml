name: Automated ClickUp Dashboard Ingestion

on:
  schedule:
    - cron: '0 8 * * *' # Executes daily at 08:00 AM UTC
  workflow_dispatch: # Manual execution testing trigger

jobs:
  build-and-push-report:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository code
      uses: actions/checkout@v4

    - name: Setup Node.js environment
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Process ClickUp Payload and Compile
      env:
        CLICKUP_TOKEN: ${{ secrets.CLICKUP_TOKEN }}
      run: |
        node -e "
        const fs = require('fs');

        async function run() {
          try {
            console.log('Requesting latest task metrics from ClickUp List API...');
            
            const token = process.env.CLICKUP_TOKEN ? process.env.CLICKUP_TOKEN.trim() : '';
            if (!token) throw new Error('CLICKUP_TOKEN secret is missing or empty in GitHub Settings.');

            // Target the clean, processed List ID digits from your URL
            const listId = '3592954'; 
            const apiUrl = 'https://clickup.com/' + listId + '/task';
            console.log('Targeting API URL Endpoint: ' + apiUrl);

            const response = await fetch(apiUrl, {
              headers: { 
                'Authorization': token,
                'Content-Type': 'application/json'
              }
            });
            
            if (!response.ok) {
              throw new Error('ClickUp endpoint connectivity issue: ' + response.status + ' ' + response.statusText);
            }
            
            const data = await response.json();
            
            if (!data || !Array.isArray(data.tasks)) {
              throw new Error('Unexpected API response structure from ClickUp. Tasks array not found.');
            }

            console.log('Successfully fetched ' + data.tasks.length + ' tasks. Formatting data mapping...');

            const formattedTasks = data.tasks.map(task => {
              const getCustomField = (name) => {
                if (!task.custom_fields || !Array.isArray(task.custom_fields)) return 'N/A';
                const field = task.custom_fields.find(f => f && f.name && f.name.toLowerCase() === name.toLowerCase());
                return field && field.value !== undefined ? field.value : 'N/A';
              };

              return {
                "Task": task.name || 'Untitled',
                "Status": task.status && task.status.status ? task.status.status : 'Open',
                "Assignee": (task.assignees && Array.isArray(task.assignees)) ? task.assignees.map(a => a.username || 'Unknown').join(', ') : 'Unassigned',
                "Team": getCustomField('Team'),      
                "Quarter": getCustomField('Quarter') 
              };
            });

            const dataPayloadString = JSON.stringify(formattedTasks, null, 2);

            if (!fs.existsSync('dashboard_template.html')) {
              throw new Error('File \"dashboard_template.html\" was not found in the root of your repository.');
            }

            let templateHtml = fs.readFileSync('dashboard_template.html', 'utf8');

            if (!templateHtml.includes('<!-- CLICKUP_DATA_ROWS -->')) {
              throw new Error('Token \"<!-- CLICKUP_DATA_ROWS -->\" was not found inside dashboard_template.html.');
            }

            let finalOutputHtml = templateHtml.replace('<!-- CLICKUP_DATA_ROWS -->', dataPayloadString);

            fs.writeFileSync('index.html', finalOutputHtml);
            console.log('✓ Ingestion successfully pushed to index.html.');
            
          } catch (error) {
            console.error('Fatal Pipeline Failure Exception:', error.message);
            process.exit(1);
          }
        }
        run();
        "

    - name: Push Data Update to Main Base Repository
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@://github.com"
        
        git add index.html
        
        if git diff-index --quiet HEAD; then
          echo "No variance found in data states. Staging push bypassed."
        else
          git commit -m "Automated daily metrics update: $(date +'%Y-%m-%d %H:%M:%S')"
          git push
          echo "✓ Live dashboard revision uploaded successfully."
        fi
